<script>
// Applied before first paint: reading the stored choice in the body would show
// a white flash to anyone who picked dark.
(function () {
  try {
    var s = localStorage.getItem('scanwise-theme');
    var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
  } catch (e) {}
})();
</script>

(function () {
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('scanwise-theme', dark ? 'dark' : 'light'); } catch (e) {}
